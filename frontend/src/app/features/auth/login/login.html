<div class="min-h-screen bg-gray-100 flex items-center justify-center px-4">
  <div class="w-full max-w-md rounded-2xl bg-white p-8 shadow-lg">

    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold text-gray-900">
        Welcome Back
      </h1>

      <p class="mt-2 text-gray-500">
        Sign in to continue to your chat
      </p>
    </div>

    @if (errorMessage) {
      <div class="mb-4 rounded-lg bg-red-50 px-4 py-3 text-sm text-red-600">
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="login()" class="space-y-5">

      <div>
        <label class="mb-2 block text-sm font-medium text-gray-700">
          Username
        </label>

        <input
          type="text"
          name="username"
          [(ngModel)]="username"
          placeholder="Enter your username"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-gray-700">
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
          class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading"
        class="w-full rounded-lg bg-blue-600 px-4 py-3 font-semibold text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ isLoading ? 'Signing in...' : 'Sign In' }}
      </button>

    </form>

    <p class="mt-6 text-center text-sm text-gray-500">
      Don't have an account?

      <a
        routerLink="/register"
        class="font-semibold text-blue-600 hover:text-blue-700"
      >
        Register
      </a>
    </p>

  </div>
</div>
